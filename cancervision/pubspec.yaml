name: cancervision
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Keeping this broad for compatibility with your Dart 3.9.0 environment
  sdk: ^3.0.0 

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # ✅ Firebase Core & Dependencies (Updated for compatibility)
  # The conflict was resolved by aligning firebase_auth with the newer major version 6.x.x
  firebase_core: ^4.2.1        # Using a stable, post-4.0.0 version
  firebase_auth: ^6.1.2        # 🔑 FIX: Upgraded to 6.x.x to resolve conflict with firebase_storage 13.x.x
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0    # Retaining 13.0.0
  firebase_app_check: ^0.4.0
  google_sign_in: ^6.2.1
 
 # 📦 Image & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # 📦 Local Database
  sqflite: ^2.3.0+1
  path_provider: ^2.1.1
  
  # 📦 UI Components
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  shimmer: ^3.0.0
  
  # 📦 Utilities
  intl: ^0.20.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  path: ^1.9.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets\images\breast cancer.jpg
    - assets\images\colon cancer.jpg
    - assets\images\lung cancer.jpg
    - assets\images\skin cancer.webp